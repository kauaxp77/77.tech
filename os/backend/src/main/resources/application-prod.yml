# Produção (Render). Segredo nenhum tem valor padrão: faltou, a aplicação não sobe.
spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    hikari:
      # Tamanho do pool: a conta, não o chute.
      #
      # Cada requisição usa UMA conexão por vez. Isso vale inclusive para as que gravam
      # auditoria de dentro de uma transação: o AuditLoggerImpl espera o commit em vez
      # de abrir outra transação por cima (ver TransactionNestingTest). Sem isso, uma
      # thread seguraria duas conexões e o pool esgotaria com poucas requisições juntas.
      #
      # Com uma conexão por thread, o pool limita quantas requisições o banco atende ao
      # mesmo tempo. 10 é folgado para o tamanho deste sistema e cabe no Supabase: duas
      # instâncias convivem durante um deploy, então o consumo máximo é 2 × 10 = 20.
      #
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:10}
      # Se faltar conexão, falhar em 10s em vez dos 30s padrão: erro rápido é melhor do
      # que a tela do cliente parada meio minuto.
      connection-timeout: 10000
  flyway:
    user: ${FLYWAY_USER}
    password: ${FLYWAY_PASSWORD}
  mail:
    # Resend por SMTP (porta 587 com STARTTLS).
    host: ${SMTP_HOST}
    port: ${SMTP_PORT}
    username: ${SMTP_USER}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  tomcat:
    threads:
      max: 120

logging:
  level:
    root: INFO
    com.xp77.os: INFO

xp77:
  auth:
    jwt-secret: ${JWT_SECRET}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  email:
    from: ${MAIL_FROM}
    base-url: ${APP_BASE_URL}
